[package]
name = "ardoise-spell"
version = "1.0.1"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Spelling plugin of Ardoise"
license = "MIT"

[[bin]]
name = "spell"
path = "src/main.rs"

[dependencies]
ardoise-plugin = { git = "https://github.com/ardoise-editor/plugin-sdk", tag = "v0.12.0" }
spellbook = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
